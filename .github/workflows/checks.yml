name: Run checks
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: cat package.json
      - run: npm run check:ci
      - run: npm run check:types
      - run: npm run check:test
      - run: npm run build:prod
