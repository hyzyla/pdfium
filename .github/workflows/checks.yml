name: Run checks
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:ci
      - run: npm run check:types
      - run: npm run check:test
      - run: npm run build:prod
      - run: npm run check:package
