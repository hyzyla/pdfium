name: Publish to NPM
on:
  release:
    types: [published]
  # also allow manual triggering of the workflow from the Actions tab
  # if for some reason the release doesn't need to be created first
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG doesn't match package.json version $version"
            exit 1
          fi
      - run: npm ci && npm run build:prod
      - run: npm run check:package
      - run: npm publish --provenance
